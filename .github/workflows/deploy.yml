name: Self-Hosted CI/CD Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # STAGE 1: CI (Continuous Integration)
  # ==========================================
  test:
    name: Run Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest test_app.py

  # ==========================================
  # STAGE 2: CD (Continuous Deployment)
  # ==========================================
  deploy:
    name: Deploy Container to Local Server
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rebuild and Restart Docker Container
        run: |
          docker compose down
          docker compose up -d --build
