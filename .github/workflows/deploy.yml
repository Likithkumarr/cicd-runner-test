name: Deploy Directly to WSL (No Docker)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-wsl:
    runs-on: self-hosted
    env:
      # Prevents GitHub runner from auto-killing background processes when step finishes
      ACTIONS_RUNNER_PROCESS_TREE_CLEANUP: false

    steps:
      - name: 1. Pull Latest Code from GitHub into WSL
        uses: actions/checkout@v4

      - name: 2. Install / Update Python Dependencies
        run: |
          export PATH=$PATH:$HOME/.local/bin
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: 3. Run Automated Tests
        run: |
          export PATH=$PATH:$HOME/.local/bin
          python3 -m pytest test_app.py

      - name: 4. Restart Python App in WSL
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Stop old uvicorn instance
          pkill -f "uvicorn" || true
          sleep 1

          # Start uvicorn detached in background
          nohup python3 -m uvicorn app:app --host 0.0.0.0 --port 8000 </dev/null > app.log 2>&1 &

          sleep 3
          echo "🎉 Checking live response from deployed app:"
          curl -s http://localhost:8000/
